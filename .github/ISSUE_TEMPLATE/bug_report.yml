name: Bug report
description: Report a reproducible problem with Faldony
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check for an existing issue covering the same problem.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: How to trigger it (upload type, query, UI steps, API call).
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, Docker version, how the stack was started, backend/frontend commit or version if known.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: use helpers services to get useful logs and traces.
      render: shell