server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # WebAssembly binaries served with the correct MIME type. `types` at
    # server level replaces the inherited map, so re-include the standard
    # mime.types first (otherwise html/js/css fall back to text/plain and the
    # browser downloads them instead of rendering).
    include mime.types;
    types {
        application/wasm wasm;
    }

    # Prefer build-time compressed assets, with dynamic compression as a
    # fallback for text-like responses and wasm binaries.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/html application/javascript application/json application/wasm image/svg+xml;

    # SPA fallback (deep links resolve to the shell).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell must never be cached: a stale entry (e.g. one cached as
    # text/plain from a misconfigured build) would keep the browser on a
    # download prompt even after the server is fixed. Always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed wasm assets are content-addressed: cache forever (one name per
    # build output).
    location ~* \.(wasm)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The build renames the loader with its content hash and rewrites
    # index.html. It is therefore safe to cache exactly like hashed wasm.
    location ~* "^/frontendKMP\.[0-9a-f]{12}\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Compose resource names are stable rather than content-hashed. Revalidate
    # them so asset changes cannot remain stale across deployments.
    location ^~ /composeResources/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Any future unhashed text assets revalidate instead of surviving a deploy.
    location ~* \.(js|css|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API proxy: the browser talks to its own origin (http://<host>:8080) and
    # nginx forwards /api/v1/** to the backend over the compose network.
    # Buffering is off so SSE streams (/api/v1/documents/stream,
    # /api/v1/processes/.../events) flow through unchanged.
    # ^~ beats the *.json regex above so API JSON is never intercepted.
    location ^~ /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
